<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HTTP/2 WebSocket Proxy</title>
</head>
<style>
    /* Keep your exact same CSS styles here */
    body { font-family: var(--vscode-font-family); padding: 20px; color: var(--vscode-editor-foreground); background-color: var(--vscode-editor-background); }
    h2 { border-bottom: 1px solid var(--vscode-panel-border); padding-bottom: 10px; }
    #status { margin-bottom: 20px; font-weight: bold; color: var(--vscode-terminal-ansiBrightGreen); }
    .user-list { list-style: none; padding: 0; }
    .user-item { display: flex; align-items: center; margin-bottom: 10px; font-size: 14px; padding: 8px; background: var(--vscode-editorWidget-background); border-radius: 4px; border: 1px solid var(--vscode-widget-border); }
    .color-dot { width: 12px; height: 12px; border-radius: 50%; margin-right: 10px; }
    .you-badge { margin-left: auto; font-size: 10px; background: var(--vscode-badge-background); color: var(--vscode-badge-foreground); padding: 2px 6px; border-radius: 10px; }
    #disconnect-btn { background-color: var(--vscode-button-background); color: var(--vscode-button-foreground); border: none; padding: 6px 12px; cursor: pointer; border-radius: 2px; display: none; margin-bottom: 20px; }
</style>
<body>
    <h2>🌐 HTTP/2 Session (WebSocket)</h2>
    <div id="status">Waiting for connection...</div>
    <button id="disconnect-btn">Disconnect from Session</button>

    <h3>Active Users</h3>
    <ul id="users" class="user-list"></ul>

    <script>
        const TRANSPORT_NAME = 'websocket';
        const PING_INTERVAL_MS = 500;

        const vscode = typeof acquireVsCodeApi === 'function' ? acquireVsCodeApi() : { postMessage: (msg) => console.log('VSCode msg:', msg) };
        let ws = null;
        let pingTimer = null;

        document.getElementById('disconnect-btn').addEventListener('click', () => {
            document.getElementById('status').textContent = 'Disconnecting...';
            vscode.postMessage({ type: 'request-disconnect' });
        });

        window.addEventListener('message', async event => {
            const message = event.data;
            if (message.type === 'connect') {
                connectToRoom(message.roomId);
            }
            else if (message.type === 'send-msg' && ws && ws.readyState === WebSocket.OPEN) {
                // WebSockets don't have separate datagram streams, everything goes over the same pipe
                ws.send(JSON.stringify(message.payload));
            }
            else if (message.type === 'execute-disconnect') {
                clearInterval(pingTimer);
                if (ws) ws.close();
                document.getElementById('status').textContent = 'Disconnected';
                document.getElementById('disconnect-btn').style.display = 'none';
                document.getElementById('users').innerHTML = '';
            }
            // Keep your exact same update-users UI logic here
            else if (message.type === 'update-users') {
                const usersList = document.getElementById('users');
                usersList.innerHTML = '';
                message.users.forEach(u => {
                    const li = document.createElement('li');
                    li.className = 'user-item';
                    const dot = document.createElement('div');
                    dot.className = 'color-dot';
                    dot.style.backgroundColor = u.color;
                    const nameSpan = document.createElement('span');
                    nameSpan.textContent = u.name;
                    li.appendChild(dot);
                    li.appendChild(nameSpan);
                    if (u.isMe) {
                        const badge = document.createElement('span');
                        badge.className = 'you-badge';
                        badge.textContent = 'YOU';
                        li.appendChild(badge);
                    }
                    usersList.appendChild(li);
                });
            }
        });

        function connectToRoom(roomId) {
            clearInterval(pingTimer);
            if (ws) ws.close();

            const setupStart = performance.now();
            
            // Note the wss:// protocol (WebSocket Secure)
            ws = new WebSocket(`wss://omar-thesis.duckdns.org:8443/yjs-router`);

            ws.onopen = () => {
                const setupMs = performance.now() - setupStart;
                document.getElementById('status').textContent = `Connected to Room: ${roomId}`;
                document.getElementById('disconnect-btn').style.display = 'block';

                // Send initial handshake
                ws.send(JSON.stringify({ type: 'join', roomId: roomId }));

                pingTimer = setInterval(() => {
                    if (ws.readyState === WebSocket.OPEN) {
                        ws.send(JSON.stringify({ type: 'ping', clientTime: performance.now() }));
                    }
                }, PING_INTERVAL_MS);

                vscode.postMessage({ type: 'setup-metric', transport: TRANSPORT_NAME, setupMs: setupMs });
                vscode.postMessage({ type: 'status', message: `Connected via WebSocket! Joining ${roomId}...` });
                vscode.postMessage({ type: 'network-connected' });
            };

            ws.onmessage = (event) => {
                try {
                    const msg = JSON.parse(event.data);
                    
                    if (msg.type === 'pong') {
                        const rtt = performance.now() - msg.clientTime;
                        vscode.postMessage({ type: 'latency-metric', transport: TRANSPORT_NAME, rtt: rtt });
                        return;
                    }
                    
                    // Route doc and awareness updates back to the extension
                    vscode.postMessage({ type: 'incoming-msg', payload: msg });
                } catch (e) {
                    console.error('JSON Parse Error in proxy');
                }
            };

            ws.onerror = (error) => {
                vscode.postMessage({ type: 'status', message: 'WebSocket connection failed.' });
            };
        }
    </script>
</body>
</html>
